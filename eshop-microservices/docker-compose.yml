services:
  catalogdb:
    image: postgres:16
    
  basketdb:
    image: postgres:16
    
  distributedCache:
    image: redis

  catalog.api:
    image: ${DOCKER_REGISTRY-}catalog.api
    build:
      context: .
      dockerfile: Services/Catalog/CatalogApi/Dockerfile
      
  basket.api:
    image: ${DOCKER_REGISTRY-}basket.api
    build:
      context: .
      dockerfile: Services/Basket/BasketApi/Dockerfile

volumes:
  postgres_catalog:
  postgres_basket:
